<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="card border-secondary">
                <div class="card-header">
                    <h3 class="mb-0">Login</h3>
                </div>

                <div class="card-body">
                    <div *ngIf="!authService.getUser(); else loggedBlock">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input id="username" type="text" class="form-control" [(ngModel)]="username"
                                name="username" />
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" type="password" class="form-control" [(ngModel)]="password"
                                name="password" />
                        </div>

                        <button type="button" class="btn btn-primary" (click)="login()">
                            Entrar
                        </button>

                        <div class="text-danger mt-3" *ngIf="msg">
                            {{ msg }}
                        </div>
                    </div>

                    <ng-template #loggedBlock>
                        <p>Usuario logueado: {{ authService.getUser() }}</p>
                        <button type="button" class="btn btn-danger" (click)="logout()">
                            Salir
                        </button>
                    </ng-template>
                </div>
            </div>
        </div>
    </div>
</div>
