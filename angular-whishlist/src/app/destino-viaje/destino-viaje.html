<div class="card-content">
    <div class="card-img">
        <img src="https://picsum.photos/seed/nature/600/350" class="card-img-top" alt="Destino" />
        <span>
            <h4>{{ position }}</h4>
        </span>
    </div>

    <div class="card-desc">
        <div class="mb-2">
            <a href="#" class="btn btn-outline-success btn-sm me-2" appTrackearClick
                data-trackear-tags="destino-vote-up lista-destinos-item" (click)="voteUp()">
                👍
            </a>

            <a href="#" class="btn btn-outline-danger btn-sm me-2" appTrackearClick
                data-trackear-tags="destino-vote-down lista-destinos-item" (click)="voteDown()">
                👎
            </a>

            <span class="fw-bold">Votos: {{ destino.votes }}</span>
        </div>

        <button type="button" class="btn btn-success btn-sm me-2" appTrackearClick
            data-trackear-tags="destino-go lista-destinos-item" (click)="ir()">
            IR
        </button>

        <button type="button" class="btn btn-danger btn-sm me-2" (click)="borrar()">
            Borrar
        </button>

        <span *ngIf="destino.isSelected()">
            {{ '{PREFERIDO}' }}
        </span>

        <span class="ms-2">
            <a [routerLink]="['/destino']">ver detalle</a>
        </span>
    </div>
</div>
