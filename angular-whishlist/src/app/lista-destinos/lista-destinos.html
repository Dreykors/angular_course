<div class="container py-5">
    <app-form-destino-viaje (onItemAdded)="agregado($event)"></app-form-destino-viaje>

    <hr class="my-5" />

    <div class="row row-flex">
        <app-destino-viaje *ngFor="let d of destinos; let i = index" [destino]="d" [idx]="i + 1"
            (clicked)="elegido($event)"></app-destino-viaje>
    </div>
</div>
