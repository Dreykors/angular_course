<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card border-secondary">
            <div class="card-header">
                <h3 class="mb-0">Wishlist</h3>
            </div>

            <div class="card-body">
                <form [formGroup]="fg" (ngSubmit)="guardar()">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input id="nombre" type="text" class="form-control" placeholder="Ingresar nombre..."
                            formControlName="nombre" />

                        <div class="text-danger mt-1" *ngIf="fg.get('nombre')?.invalid && fg.get('nombre')?.touched">
                            <span *ngIf="fg.get('nombre')?.hasError('required')">
                                Nombre requerido
                            </span>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="url" class="form-label">Imagen URL</label>
                        <input id="url" type="text" class="form-control" placeholder="Ingresar url..."
                            formControlName="url" />

                        <div class="text-danger mt-1" *ngIf="fg.get('url')?.invalid && fg.get('url')?.touched">
                            <span *ngIf="fg.get('url')?.hasError('required')">
                                URL requerida
                            </span>
                        </div>
                    </div>

                    <button *ngIf="fg.valid" type="submit" class="btn btn-primary">
                        Guardar!
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
